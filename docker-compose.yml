version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: smart-home-db
    environment:
      POSTGRES_USER: hub_user
      POSTGRES_PASSWORD: hub_secure_pass_123
      POSTGRES_DB: smart_home_hub
    ports:
      - "5432:5432"
    volumes:
      # Persist database files
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_user -d smart_home_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-home-backend
    environment:
      DATABASE_URL: postgresql://hub_user:hub_secure_pass_123@postgres:5432/smart_home_hub
      DEBUG: "True"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # Mount source code for hot reload
      - .:/app

volumes:
  postgres_data:

# Usage:
#   docker-compose up
# 
# Then:
#   - API available at http://localhost:8000
#   - Database at localhost:5432
#   - Docs at http://localhost:8000/docs
